# Dependency updates are owned by Renovate (see renovate.json).
#
# This file exists to neutralize Dependabot version updates, including any
# configured through the repository settings UI, whose scheduled runs kept
# failing: a checked-in dependabot.yml supersedes the UI configuration, and
# `open-pull-requests-limit: 0` is the documented way to disable update PRs
# for an ecosystem (the schema requires at least one `updates` entry, so an
# empty list is not valid).
# To hand an ecosystem back to Dependabot, raise the PR limit below and
# remove the matching Renovate config.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
