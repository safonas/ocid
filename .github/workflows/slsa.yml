# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow lets you generate SLSA provenance file for your project.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release to attach artifacts to (e.g. v0.5.0)'
        required: true
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      # Releases on this repo are immutable once published, so artifacts are
      # attached to the draft release created by `just publish-release`; the
      # publish job below flips it to published as the last step.
      - name: Verify target release is a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view '${{ inputs.tag }}' --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::release ${{ inputs.tag }} is not a draft; releases are immutable once published" >&2
            exit 1
          fi

      # Build exactly the tagged tree, not the dispatch ref: retries after
      # main moved on (just republish) still produce the release's bits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-linux-android

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross-compilation toolchain for ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Android NDK (Termux / aarch64-linux-android)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      # ========================================================
      #
      # Step 1: Build your artifacts (reproducible & multi-arch).
      #
      # ========================================================
      - name: Build artifacts
        run: |
          set -euo pipefail

          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/build"

          # Build x86_64
          cargo build --release --locked --target x86_64-unknown-linux-gnu

          # Build arm64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          cargo build --release --locked --target aarch64-unknown-linux-gnu

          # Build Android arm64 (Termux, bionic libc).
          # API 26 keeps compat back to Android 8 while running fine on
          # current devices (Android 13+). No .deb/.rpm: Termux has no systemd
          # and installs to $PREFIX/bin instead of /usr/bin.
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android

          mkdir -p dist

          # Standalone binaries
          cp target/x86_64-unknown-linux-gnu/release/ocid dist/ocid-linux-amd64
          cp target/x86_64-unknown-linux-gnu/release/ocictl dist/ocictl-linux-amd64
          cp target/x86_64-unknown-linux-gnu/release/ocitop dist/ocitop-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/ocid dist/ocid-linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/ocictl dist/ocictl-linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/ocitop dist/ocitop-linux-arm64
          cp target/aarch64-linux-android/release/ocid dist/ocid-android-arm64
          cp target/aarch64-linux-android/release/ocictl dist/ocictl-android-arm64
          cp target/aarch64-linux-android/release/ocitop dist/ocitop-android-arm64

          # Deterministic tarballs
          GZIP="-n" tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf dist/ocid-linux-amd64.tar.gz -C target/x86_64-unknown-linux-gnu/release ocid ocictl ocitop

          GZIP="-n" tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf dist/ocid-linux-arm64.tar.gz -C target/aarch64-unknown-linux-gnu/release ocid ocictl ocitop

          GZIP="-n" tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf dist/ocid-android-arm64.tar.gz -C target/aarch64-linux-android/release ocid ocictl ocitop

      - name: Build .deb and .rpm packages
        env:
          NFPM_VERSION: v2.47.0
        run: |
          set -euo pipefail

          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz" \
            | tar -xzf - -C /tmp nfpm
          PKG_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)

          for spec in "amd64:x86_64-unknown-linux-gnu" "arm64:aarch64-unknown-linux-gnu"; do
            nfpm_arch=${spec%%:*}
            target=${spec##*:}
            stage="dist/stage"
            cfg="dist/nfpm-${nfpm_arch}.yaml"
            mkdir -p "$stage"
            cp "target/${target}/release/ocid" "target/${target}/release/ocictl" "target/${target}/release/ocitop" "$stage/"
            sed -e "s|@@VERSION@@|${PKG_VERSION}|g" -e "s|@@ARCH@@|${nfpm_arch}|g" -e "s|@@STAGE@@|${stage}|g" \
              packaging/nfpm.yaml > "$cfg"
            /tmp/nfpm package --config "$cfg" --packager deb --target dist/
            /tmp/nfpm package --config "$cfg" --packager rpm --target dist/
            rm -rf "$stage" "$cfg"
          done
          ls dist/

      # ========================================================
      #
      # Step 2: Add a step to generate the provenance subjects
      #         as shown below. Update the sha256 sum arguments
      #         to include all binaries that you generate
      #         provenance for.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          cd dist
          files=(./ocid-linux-* ./ocictl-linux-* ./ocitop-linux-* ./ocid-android-* ./ocictl-android-* ./ocitop-android-* ./*.deb ./*.rpm)
          # Generate the subjects (base64 encoded).
          echo "digests=$(sha256sum "${files[@]}" | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/* --clobber

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Verify target release is a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view '${{ inputs.tag }}' --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::release ${{ inputs.tag }} is not a draft; releases are immutable once published" >&2
            exit 1
          fi

      # Build exactly the tagged tree, not the dispatch ref (see build-linux).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify cross-compile target
        run: rustup target list --installed

      - name: Build artifacts
        run: |
          set -euo pipefail

          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/build"

          # Build native (arm64 on Apple Silicon runners)
          cargo build --release --locked

          # Cross-compile for Intel
          cargo build --release --locked --target x86_64-apple-darwin

          mkdir -p dist

          # Standalone binaries (arm64 = native, amd64 = cross)
          cp target/release/ocid dist/ocid-darwin-arm64
          cp target/release/ocictl dist/ocictl-darwin-arm64
          cp target/release/ocitop dist/ocitop-darwin-arm64
          cp target/x86_64-apple-darwin/release/ocid dist/ocid-darwin-amd64
          cp target/x86_64-apple-darwin/release/ocictl dist/ocictl-darwin-amd64
          cp target/x86_64-apple-darwin/release/ocitop dist/ocitop-darwin-amd64

          # Deterministic tarballs (BSD tar on macOS doesn't support --sort/--owner/--group)
          cd target/release && tar -czf ../../dist/ocid-darwin-arm64.tar.gz ocid ocictl ocitop && cd ../..
          cd target/x86_64-apple-darwin/release && tar -czf ../../../dist/ocid-darwin-amd64.tar.gz ocid ocictl ocitop && cd ../../..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/* --clobber

  provenance:
    needs: [build-linux]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      # contents: write is required by the generator's job declarations even
      # with upload-assets: false (GitHub validates every called-workflow job
      # permission at startup, skipped jobs included).
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build-linux.outputs.digests }}"
      # The generator's release upload resolves releases by tag, which cannot
      # see drafts — it would try to create a new release and hit the
      # immutability guard. It uploads provenance as a workflow artifact
      # instead; the publish job attaches it to the draft.
      upload-assets: false

  # Immutable releases freeze at publish time, so this must be the only job
  # that publishes — and only after every artifact and the provenance are
  # attached to the draft.
  publish:
    needs: [build-linux, build-macos, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # To download the provenance artifact.
    steps:
      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Attach provenance and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view '${{ inputs.tag }}' --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::release ${{ inputs.tag }} is not a draft; refusing to publish" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" provenance/*.intoto.jsonl --clobber
          gh release edit "${{ inputs.tag }}" --draft=false
          echo "Published: https://github.com/safonas/ocid/releases/tag/${{ inputs.tag }}"
