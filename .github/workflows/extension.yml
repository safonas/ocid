# Podman Desktop extension: check on PRs, publish the OCI artifact to
# ghcr.io when a release is published (or on demand for an existing tag).
#
# Testers install it in Podman Desktop via Settings → Extensions →
# "Install from OCI image": ghcr.io/safonas/ocid-extension:testing.
# The artifact embeds a bundled daemon image (per arch, from the release
# binaries compiled once by slsa.yml).

name: extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the extension image from (e.g. v0.6.2)'
        required: true
        type: string
  pull_request:
    paths:
      - 'extensions/podman-desktop/**'
      - 'just/extension.just'
      - 'Containerfile.daemon'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

jobs:
  # PRs: typecheck, unit tests, and an image build (no push). The daemon
  # bundle is a placeholder here — no Rust build per PR; the COPY path is
  # still exercised.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: just

      - name: Typecheck
        run: just ext-check

      - name: Unit tests
        run: just ext-test

      - name: Build the OCI artifact
        run: |
          mkdir -p extensions/podman-desktop/bin
          tar -cf extensions/podman-desktop/bin/ocid-daemon.tar -T /dev/null
          podman build -t ocid-extension:pr -f extensions/podman-desktop/Containerfile extensions/podman-desktop

  # Release/dispatch: build the multi-arch image from the tag and push it
  # under the version tag and the mutable :testing tag.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the tag to build
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag='${{ github.event.release.tag_name }}'
          [ -n "$tag" ] || { echo "::error::no tag input and not a release event" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: just

      - name: Typecheck and unit tests
        run: |
          just ext-check
          just ext-test

      # The daemon image is assembled from the release binary slsa.yml
      # already compiled (its publish job dispatches this workflow after
      # uploading it — no second Rust build; glibc is backward-compatible
      # onto Wolfi's rolling base). Only `ocid` is bundled; host-side
      # ocictl manages the pod daemon over https.
      - name: Stage the release binary for the bundled daemon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gh release download "$TAG" --pattern "ocid-*-linux-${arch}.tar.gz" --output "ocid-${arch}.tar.gz" --clobber
            mkdir -p "dist/daemon-${arch}"
            tar -xzf "ocid-${arch}.tar.gz" -C "dist/daemon-${arch}"
          done

      # The arm64 builder stage runs under emulation (the artifact itself is
      # arch-independent JS; the daemon image just copies binaries in).
      - name: Register arm64 binfmt handlers
        run: docker run --privileged --rm "docker.io/tonistiigi/binfmt:qemu-v7.0.0@sha256:66e11bea77a5ea9d6f0fe79b57cd2b189b5d15b93a2bdb925be22949232e4e55" --install arm64

      # buildah (in a digest-pinned container — the same container-tooling
      # stack the repo already uses) builds, per arch: the daemon image from
      # the staged binaries (Containerfile.daemon), exported as a tarball
      # the extension artifact embeds, then the extension image itself;
      # both platforms land in one manifest list pushed under the version
      # tag and :testing. The runner's own podman 4.x cannot produce the
      # list: its buildah stamps scratch-stage configs with the host
      # architecture and dedupes manifest entries by digest, so every podman
      # path shipped a single amd64 entry (#56–#59). Kept inline in the
      # workflow — not in the justfile — so the build recipe is stable
      # against the tagged tree this job checks out (see #59).
      - name: Build and push the multi-arch OCI artifact
        env:
          GHCR: ghcr.io/${{ github.repository_owner }}/ocid-extension
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.repository_owner }}' --password-stdin --authfile "$RUNNER_TEMP/ghcr-auth.json"
          docker run --rm --privileged \
            -e GHCR -e TAG \
            -v "$PWD":/src \
            -v "$RUNNER_TEMP/ghcr-auth.json":/auth.json:ro \
            "quay.io/buildah/stable:v1.43.4@sha256:b1899f37300ac68c25a2175eac31506e0541bb4fa8156c40ee5120a6194d20cf" \
            sh -c '
              set -euo pipefail
              cd /src
              mkdir -p extensions/podman-desktop/bin
              for arch in amd64 arm64; do
                rm -rf dist/daemon-bin && mkdir -p dist/daemon-bin
                cp dist/daemon-$arch/ocid dist/daemon-bin/
                buildah bud --platform linux/$arch -t localhost/ocid-daemon:ext -f Containerfile.daemon .
                rm -f extensions/podman-desktop/bin/ocid-daemon.tar
                buildah push localhost/ocid-daemon:ext docker-archive:extensions/podman-desktop/bin/ocid-daemon.tar:localhost/ocid-daemon:ext
                buildah bud --platform linux/$arch --manifest "$GHCR:$TAG" -f extensions/podman-desktop/Containerfile extensions/podman-desktop
              done
              buildah manifest push --all --authfile /auth.json "$GHCR:$TAG" "docker://$GHCR:$TAG"
              buildah manifest push --all --authfile /auth.json "$GHCR:$TAG" "docker://$GHCR:testing"
            '
