# Podman Desktop extension: check on PRs, publish the OCI artifact to
# ghcr.io when a release is published (or on demand for an existing tag).
#
# Testers install it in Podman Desktop via Settings → Extensions →
# "Install from OCI image": ghcr.io/safonas/ocid-extension:testing.
#
# The artifact is arch-independent JS, but the manifest list still carries
# amd64 + arm64 so pulls match on any host.

name: extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the extension image from (e.g. v0.6.2)'
        required: true
        type: string
  pull_request:
    paths:
      - 'extensions/podman-desktop/**'
      - 'just/extension.just'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

jobs:
  # PRs: typecheck, unit tests, and an image build (no push).
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: just

      - name: Typecheck
        run: just ext-check

      - name: Unit tests
        run: just ext-test

      - name: Build the OCI artifact
        run: just ext-image

  # Release/dispatch: build the multi-arch image from the tag and push it
  # under the version tag and the mutable :testing tag.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the tag to build
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag='${{ github.event.release.tag_name }}'
          [ -n "$tag" ] || { echo "::error::no tag input and not a release event" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install just
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: just

      - name: Typecheck and unit tests
        run: |
          just ext-check
          just ext-test

      # The arm64 builder stage runs under emulation (the artifact itself is
      # arch-independent JS).
      - name: Register arm64 binfmt handlers
        run: docker run --privileged --rm "docker.io/tonistiigi/binfmt:qemu-v7.0.0@sha256:66e11bea77a5ea9d6f0fe79b57cd2b189b5d15b93a2bdb925be22949232e4e55" --install arm64

      # buildah (in a digest-pinned container — the same container-tooling
      # stack the repo already uses) builds both platforms into one manifest
      # list and pushes it under the version tag and :testing. The runner's
      # own podman 4.x cannot produce the list: its buildah stamps
      # scratch-stage configs with the host architecture and dedupes
      # manifest entries by digest, so every podman path shipped a single
      # amd64 entry (#56–#59). Kept inline in the workflow — not in the
      # justfile — so the build recipe is stable against the tagged tree
      # this job checks out (see #59).
      - name: Build and push the multi-arch OCI artifact
        env:
          GHCR: ghcr.io/${{ github.repository_owner }}/ocid-extension
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.repository_owner }}' --password-stdin --authfile "$RUNNER_TEMP/ghcr-auth.json"
          docker run --rm --privileged \
            -e GHCR -e TAG \
            -v "$PWD/extensions/podman-desktop":/src \
            -v "$RUNNER_TEMP/ghcr-auth.json":/auth.json:ro \
            "quay.io/buildah/stable:v1.43.2@sha256:704af5d17babbd88bd93c06ecea7554001a2e9570e1fd54687188d3ae5de0e55" \
            sh -c '
              set -euo pipefail
              cd /src
              buildah bud --platform linux/amd64 --manifest "$GHCR:$TAG" -f Containerfile .
              buildah bud --platform linux/arm64 --manifest "$GHCR:$TAG" -f Containerfile .
              buildah manifest push --all --authfile /auth.json "$GHCR:$TAG" "docker://$GHCR:$TAG"
              buildah manifest push --all --authfile /auth.json "$GHCR:$TAG" "docker://$GHCR:testing"
            '
