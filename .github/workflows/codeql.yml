name: CodeQL

# SAST for the Rust workspace (OSSF Scorecard SAST check). Rust has no
# autobuild, so the workspace is built explicitly between init and analyze.
# Complements the Trivy/Scorecard scans in security.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Mondays at 04:00 UTC, after the security scan
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain comes from rust-toolchain.toml (auto-installed by rustup).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: rust
          # Repo-local config: ocictl prints the node's own public key on
          # purpose (whoami/init/dns-record are identity display commands);
          # exclude rust/cleartext-logging for that file only.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build workspace
        run: cargo build --locked

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: rust
