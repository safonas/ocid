name: Deploy Docs to GitHub Pages

# Deploy MkDocs to GitHub Pages on push to main (official actions/deploy-pages)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'Cargo.toml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        # The virtualenv is kept OUTSIDE docs/ (which is the mkdocs
        # docs_dir): a venv inside it would be walked by every build and
        # by the git-revision plugins, which warn on its vendored files
        # under --strict.
        run: cd docs && uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.docs-venv

      - name: Build MkDocs
        # mkdocs.yml lives in docs/ and builds from there (docs_dir: '.',
        # site_dir: ../site -> repo-root site/).
        run: |
          cd docs && uv run mkdocs build --strict --config-file mkdocs.yml
          # Create a .nojekyll file to prevent GitHub Pages from ignoring underscores
          touch ../site/.nojekyll
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.docs-venv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
