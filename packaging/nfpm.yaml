# nfpm config TEMPLATE: builds .deb and .rpm from one file.
#
# Tokens @@VERSION@@, @@ARCH@@ and @@STAGE@@ are rendered at build time by
# `just pkg` / CI into dist/nfpm-<arch>.yaml, e.g.:
#   sed -e "s|@@VERSION@@|0.2.0|g" -e "s|@@ARCH@@|amd64|g" \
#       -e "s|@@STAGE@@|dist/stage|g" packaging/nfpm.yaml > dist/nfpm-amd64.yaml
#   nfpm package --config dist/nfpm-amd64.yaml --packager deb --target dist/

name: ocid
arch: "@@ARCH@@"
version: "@@VERSION@@"
release: 1
section: net
priority: optional
maintainer: ocid contributors <https://github.com/safonas/ocid>
description: |-
  Local-first, peer-to-peer distribution of OCI container images.
  The ocid daemon serves an embedded OCI registry on localhost:5050
  and replicates signed releases over iroh; ocictl controls it.
vendor: ocid contributors
homepage: https://github.com/safonas/ocid
license: GPL-3.0-or-later

depends:
  - ca-certificates

contents:
  - src: "@@STAGE@@/ocid"
    dst: /usr/bin/ocid
    type: file
    file_info:
      mode: 0755
  - src: "@@STAGE@@/ocictl"
    dst: /usr/bin/ocictl
    type: file
    file_info:
      mode: 0755
  - src: "@@STAGE@@/ocitop"
    dst: /usr/bin/ocitop
    type: file
    file_info:
      mode: 0755
  - src: packaging/systemd/ocid.service
    dst: /usr/lib/systemd/system/ocid.service
    type: file
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/ocid/README.md
    type: file
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/ocid/copyright
    type: file
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

deb:
  compression: gzip

rpm:
  group: System Environment/Daemons
  compression: gzip
