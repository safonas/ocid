[project]
name = "ocid-docs"
version = "0.1.0"
description = "MkDocs documentation for ocid"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-macros-plugin",
    "mkdocs-git-authors-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
    "pymdown-extensions>=11.0.1",
]

# Dependency manifest only — never built or installed as a package (uv
# would otherwise run a build backend expecting a readme and a code
# package). See uv's "projects without code".
[tool.uv]
package = false
