[package]
name = "ocid-core"
description = "Shared types for ocid: identity, config, OCI, signed releases, on-disk index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
iroh-base = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }

[features]
# HTTP client for the daemon control API (used by ocictl/ocitop, not the daemon).
client = ["dep:reqwest"]
